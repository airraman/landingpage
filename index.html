<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepWork.io - Find Your Focus</title>
    <meta property="og:title" content="DeepWork.io - Find Your Focus">
    <meta property="og:description" content="The tool for finding your focus">
    <meta property="og:image" content="https://deep-work.io/preview.png">
    <meta property="og:url" content="https://deep-work.io">
    <meta property="og:type" content="website">
    
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        main {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        h1 {
            font-size: 24px;
            font-weight: 400;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .typewriter-container {
            font-size: 18px;
            font-weight: 400;
            text-align: center;
            letter-spacing: 0.5px;
            min-height: 30px;
        }

        .typewriter-text {
            display: inline-block;
            transition: color 0.3s ease;
        }

        .color-green { color: #10b981; }
        .color-red { color: #ef4444; }
        .color-blue { color: #3b82f6; }
        .color-purple { color: #a855f7; }
        .color-orange { color: #f97316; }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 18px;
            background-color: #000000;
            margin-left: 2px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .mockup-container {
            width: 100%;
            max-width: 300px;
            display: flex;
            justify-content: center;
        }

        .mockup-container img {
            width: 100%;
            height: auto;
            border-radius: 50;
            display: block;
        }

        .download-btn {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            padding: 16px 48px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            border-radius: 50;
            display: inline-block;
            transition: background-color 0.2s ease;
        }

        .download-btn:hover {
            background-color: #333333;
        }

        @media (min-width: 768px) {
            h1 {
                font-size: 28px;
            }

            .typewriter-container {
                font-size: 20px;
            }

            .cursor {
                height: 20px;
            }

            .mockup-container {
                max-width: 350px;
            }

            .download-btn {
                font-size: 20px;
                padding: 18px 60px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>the tool for finding your focus</h1>
        
        <div class="typewriter-container">
            <span>a tool for </span>
            <span class="typewriter-text"></span>
            <span class="cursor"></span>
        </div>
        
        <div class="mockup-container">
            <img src="iphonemockup.png" alt="DeepWork.io app interface showing activity tracking">
        </div>
        
        <a href="https://apps.apple.com/us/app/deepwork-io/id6748564027" class="download-btn">
            download now
        </a>
    </main>

    <script>
        const words = [
            'coding',
            'writing',
            'designing',
            'studying',
            'reading',
            'creating',
            'building',
            'learning',
            'painting',
            'composing',
            'editing',
            'researching',
            'analyzing',
            'planning',
            'thinking',
            'sketching',
            'crafting'
        ];

        const colors = ['color-green', 'color-red', 'color-blue', 'color-purple', 'color-orange'];

        let wordIndex = 0;
        let colorIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typewriterElement = document.querySelector('.typewriter-text');
        const typingSpeed = 200;
        const deletingSpeed = 200;
        const pauseBeforeDelete = 3000;
        const pauseBeforeType = 500;

        function typeWriter() {
            const currentWord = words[wordIndex];
            
            if (isDeleting) {
                typewriterElement.textContent = currentWord.substring(0, charIndex - 1);
                charIndex--;
            } else {
                typewriterElement.textContent = currentWord.substring(0, charIndex + 1);
                charIndex++;
            }

            let timeout = isDeleting ? deletingSpeed : typingSpeed;

            if (!isDeleting && charIndex === currentWord.length) {
                timeout = pauseBeforeDelete;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                wordIndex = (wordIndex + 1) % words.length;
                colorIndex = (colorIndex + 1) % colors.length;
                
                // Change color
                typewriterElement.className = 'typewriter-text ' + colors[colorIndex];
                
                timeout = pauseBeforeType;
            }

            setTimeout(typeWriter, timeout);
        }

        // Set initial color and start
        typewriterElement.className = 'typewriter-text ' + colors[colorIndex];
        typeWriter();
    </script>
</body>
</html>
